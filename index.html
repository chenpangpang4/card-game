<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>三局夺牌</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
        body{
            background:#1a242f;color:#fff;padding:12px;max-width:700px;margin:0 auto;min-height:100vh;
        }
        .panel{
            background:#2c3b4a;border-radius:14px;padding:16px;margin-bottom:14px;
        }
        h1{
            text-align:center;color:#ffd044;margin:10px 0 16px;
            font-size:26px;
        }
        .room-input{
            width:100%;padding:13px;border-radius:10px;border:none;font-size:18px;margin:10px 0;
        }
        .btn{
            background:#2478ff;color:#fff;border:none;padding:13px 18px;border-radius:10px;font-size:16px;margin:5px;cursor:pointer;
        }
        .btn:disabled{background:#444c60;cursor:not-allowed;opacity:0.7;}
        .tip-green{color:#7fdf7f;margin:10px 0;font-size:16px;}
        .info-text{margin:8px 0;font-size:17px;}

        /* ==========斗地主风格手牌核心样式========== */
        .hand-container{
            margin:16px 0;min-height:110px;
        }
        .card{
            display:inline-block;
            background:#ffffff;
            color:#000;
            width:68px;height:96px;
            border-radius:8px;
            margin:0 -12px; /*卡牌重叠效果，棋牌APP标准样式 */
            padding:6px 4px;
            font-weight:bold;font-size:20px;text-align:center;
            box-shadow:0 2px 6px #0004;
            cursor:pointer;
            transition: transform 0.18s ease;
            position:relative;
            z-index:1;
        }
        .card.red{color:#d60000;}
        /* 选中向上抬起，斗地主同款效果 */
        .card.selected{
            transform: translateY(-22px);
            z-index:10;
            box-shadow:0 8px 12px #0006;
        }
    </style>
</head>
<body>
    <h1>🏆 三局夺牌</h1>
    <div class="panel">
        <h2>房间大厅</h2>
        <input class="room-input" id="roomIdInput" placeholder="输入房间号">
        <br>
        <button class="btn" onclick="createRoom()">创建房间（房主）</button>
        <button class="btn" onclick="joinRoom()">加入房间</button>
        <div class="tip-green" id="connTip"></div>
    </div>

    <div class="panel">
        <div class="info-text">当前积分：<span id="scoreText">0</span> 分</div>
        <div class="info-text">游戏阶段：<span id="stageText">等待开局</span></div>
        <div class="info-text">我的手牌：</div>
        <div class="hand-container" id="handBox"></div>
    </div>

    <div class="panel">
        <button class="btn" id="btnR1" onclick="sendRound1()" disabled>第一回合｜打出1张牌</button>
        <button class="btn" id="btnR2" onclick="sendRound2()" disabled>第二回合｜打出2张牌</button>
        <button class="btn" id="btnR3" onclick="sendRound3()" disabled>第三回合｜3张拖拉机比拼</button>
    </div>

<script>
const suitMap = {s:'♠',h:'♥',c:'♣',d:'♦'};
const redSuit = ['h','d'];

let peer, conn;
let roomId = "";
let myCards = [];
let selectedIndex = [];
let gameStage = "wait"; // wait / r1 / r2 / r3

// 生成扑克牌
function initCards(){
    const suits = ['s','h','c','d'];
    let cards = [];
    for(let copy=0;copy<2;copy++){
        for(let v=1;v<=13;v++) suits.forEach(s=>cards.push({suit:s,val:v,isKing:false}));
        cards.push({suit:'',val:14,isKing:true,name:"小王"});
        cards.push({suit:'',val:15,isKing:true,name:"大王"});
    }
    //洗牌
    for(let i=cards.length-1;i>0;i--){
        let j = Math.floor(Math.random()*(i+1));
        [cards[i],cards[j]] = [cards[j],cards[i]];
    }
    return cards;
}

// 牌面文字转换
function formatCard(card){
    if(card.isKing) return card.name;
    let num;
    if(card.val===1)num="A";
    else if(card.val===11)num="J";
    else if(card.val===12)num="Q";
    else if(card.val===13)num="K";
    else num=card.val;
    return num + suitMap[card.suit];
}
function isRedCard(card){
    if(card.isKing)return false;
    return redSuit.includes(card.suit);
}

// 渲染手牌【斗地主重叠布局】
function renderHand(){
    const box = document.getElementById("handBox");
    box.innerHTML = "";
    myCards.forEach((card,idx)=>{
        let cls = isRedCard(card) ? "card red" : "card";
        if(selectedIndex.includes(idx)) cls += " selected";
        let span = document.createElement("span");
        span.className = cls;
        span.innerText = formatCard(card);
        span.onclick = ()=>toggleSelect(idx);
        box.appendChild(span);
    });
}

// 选牌逻辑：点击抬起/放下，限制数量
function toggleSelect(index){
    let maxSelect = 0;
    if(gameStage === "r1") maxSelect = 1;
    if(gameStage === "r2") maxSelect = 2;
    if(gameStage === "r3") maxSelect = 3;
    if(maxSelect === 0) return;

    let pos = selectedIndex.indexOf(index);
    if(pos > -1){
        // 取消选中
        selectedIndex.splice(pos,1);
    }else{
        // 超出上限，不能多选
        if(selectedIndex.length >= maxSelect){
            setTip(`本回合最多选择${maxSelect}张牌！`);
        }else{
            selectedIndex.push(index);
        }
    }
    renderHand();
}

// ========联机房间逻辑========
function createRoom(){
    roomId = document.getElementById("roomIdInput").value || String(Math.floor(Math.random()*900000+100000));
    document.getElementById("roomIdInput").value = roomId;
    peer = new Peer(roomId);
    peer.on("open",()=>setTip("✅房间创建成功，等待玩家加入！房间号："+roomId));
    peer.on("connection",c=>{conn = c;bindConn();startGame();});
}
function joinRoom(){
    roomId = document.getElementById("roomIdInput").value.trim();
    if(!roomId){setTip("⚠️请输入房间号");return;}
    peer = new Peer();
    peer.on("open",()=>{conn = peer.connect(roomId);bindConn();});
}
function bindConn(){
    conn.on("open",()=>setTip("✅连接成功，可以开始对局！"));
    conn.on("data",(msg)=>console.log("收到消息",msg));
    conn.on("close",()=>setTip("❌连接断开，请重新进入房间"));
}
function setTip(text){
    document.getElementById("connTip").innerText = text;
}

// 开局发6张手牌
function startGame(){
    let allCards = initCards();
    myCards = allCards.slice(0,6);
    selectedIndex = [];
    gameStage = "r1";
    document.getElementById("stageText").innerText = "第一回合";
    document.getElementById("btnR1").disabled = false;
    document.getElementById("btnR2").disabled = true;
    document.getElementById("btnR3").disabled = true;
    renderHand();
}

// 出牌提交
function sendRound1(){
    if(selectedIndex.length !== 1){setTip("⚠️第一回合必须选中1张牌！");return;}
    setTip("第一回合出牌完成，进入第二回合");
    removeSelectedCards();
    gameStage = "r2";
    document.getElementById("stageText").innerText = "第二回合";
    document.getElementById("btnR1").disabled = true;
    document.getElementById("btnR2").disabled = false;
    selectedIndex = [];
    renderHand();
}
function sendRound2(){
    if(selectedIndex.length !== 2){setTip("⚠️第二回合必须选中2张牌！");return;}
    setTip("第二回合出牌完成，进入第三回合");
    removeSelectedCards();
    gameStage = "r3";
    document.getElementById("stageText").innerText = "第三回合";
    document.getElementById("btnR2").disabled = true;
    document.getElementById("btnR3").disabled = false;
    selectedIndex = [];
    renderHand();
}
function sendRound3(){
    if(selectedIndex.length !== 3){setTip("⚠️第三回合选中剩余3张牌！");return;}
    setTip("三局比拼结束，结算比分！");
}
// 移除打出的手牌
function removeSelectedCards(){
    selectedIndex.sort((a,b)=>b-a);
    selectedIndex.forEach(i=>myCards.splice(i,1));
}
</script>
</body>
</html>
